<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- AMT brand icons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/amt1.png" />
    <link rel="shortcut icon" href="/amt1.png" />
    <link rel="apple-touch-icon" href="/amt1.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="application-name" content="AMT" />
    <meta name="apple-mobile-web-app-title" content="AMT" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Advanced Micro Technologies (AMT) — enterprise ICT, low-current systems, audio-visual integration, and outside plant networks in Saudi Arabia. amt-arabia.net"
    />
    <meta name="theme-color" content="#851A18" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Advanced Micro Technologies | ICT &amp; Infrastructure Integration</title>
    <script>
      // Apply saved theme before paint to avoid a flash (default: dark)
      (function () {
        try {
          var t = localStorage.getItem("amt-theme") || "dark";
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
